[tool.poetry]
name = "fakenews-hub"
version = "0.1.0"
description = "Hub de verificação de notícias: API em tempo real (extração + NLP + cache)."
readme = "README.md"
package-mode = true
packages = [
    { include = "api" },
    { include = "scraper" },
    { include = "ml" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
fastapi = ">=0.115"
uvicorn = { version = ">=0.32", extras = ["standard"] }
sqlalchemy = { version = ">=2.0", extras = ["asyncio"] }
psycopg2-binary = ">=2.9.10"
trafilatura = ">=2.0"
httpx = "^0.28.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
httpx = ">=0.27"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
